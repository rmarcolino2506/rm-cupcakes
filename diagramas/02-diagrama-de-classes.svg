<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
<rect width="1100" height="650" fill="#fff"/><style>text{font-family:Arial,sans-serif;fill:#202a35}.title{font-size:27px;font-weight:700}.head{font-size:21px;font-weight:700}.body{font-size:16px}.classbox{fill:#f3f7f9;stroke:#416b83;stroke-width:2}.divider{stroke:#416b83;stroke-width:2}.relation{stroke:#566773;stroke-width:2;fill:none}</style>
<text x="550" y="48" text-anchor="middle" class="title">RM CupCakes — Diagrama de Classes</text>
<!-- Product -->
<rect x="70" y="145" width="300" height="365" rx="8" class="classbox"/><text x="220" y="185" text-anchor="middle" class="head">Produto</text><line x1="70" y1="205" x2="370" y2="205" class="divider"/><text x="95" y="242" class="body">- id: inteiro</text><text x="95" y="274" class="body">- nome: texto</text><text x="95" y="306" class="body">- descrição: texto</text><text x="95" y="338" class="body">- preço: decimal</text><text x="95" y="370" class="body">- categoria: texto</text><text x="95" y="402" class="body">- estoque: inteiro</text><line x1="70" y1="425" x2="370" y2="425" class="divider"/><text x="95" y="465" class="body">+ consultarDisponibilidade()</text>
<!-- Item -->
<rect x="430" y="195" width="285" height="275" rx="8" class="classbox"/><text x="572" y="235" text-anchor="middle" class="head">ItemPedido</text><line x1="430" y1="255" x2="715" y2="255" class="divider"/><text x="455" y="292" class="body">- quantidade: inteiro</text><text x="455" y="324" class="body">- preçoUnitário: decimal</text><text x="455" y="356" class="body">- subtotal: decimal</text><line x1="430" y1="380" x2="715" y2="380" class="divider"/><text x="455" y="420" class="body">+ calcularSubtotal()</text>
<!-- Pedido -->
<rect x="775" y="145" width="275" height="365" rx="8" class="classbox"/><text x="912" y="185" text-anchor="middle" class="head">Pedido</text><line x1="775" y1="205" x2="1050" y2="205" class="divider"/><text x="800" y="242" class="body">- id: texto</text><text x="800" y="274" class="body">- criadoEm: data/hora</text><text x="800" y="306" class="body">- status: texto</text><text x="800" y="338" class="body">- endereço: texto</text><text x="800" y="370" class="body">- formaPagamento: texto</text><text x="800" y="402" class="body">- total: decimal</text><line x1="775" y1="425" x2="1050" y2="425" class="divider"/><text x="800" y="465" class="body">+ calcularTotal()</text>
<!-- relations -->
<path d="M715 280H775" class="relation"/><text x="725" y="265" class="body">1..*</text><text x="720" y="310" class="body">1</text><path d="M370 320H430" class="relation"/><text x="378" y="305" class="body">*</text><text x="405" y="350" class="body">1</text>
<text x="550" y="575" text-anchor="middle" class="body">Um pedido contém um ou mais itens; cada item referencia um produto.</text>
</svg>
